<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COMTIME PRO</title>

    <link rel="stylesheet" href="/style.css">

    <!-- 공지사항 실시간 업데이트용 -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="/app.js" defer></script>
</head>

<body>
    <div id="app">

        <!-- 메인 화면 -->
        <main class="main-container">

            <header class="top-header">
                <div>
                    <h1>COMTIME PRO</h1>
                    <p>학교 시간표 · 급식 · 공지사항</p>
                </div>

                <button id="noticeOpenBtn" class="notice-open-btn" type="button">
                    공지사항
                </button>
            </header>

            <!-- 학교 검색 -->
            <section class="school-search-section">
                <div class="search-box">
                    <input
                        id="schoolSearchInput"
                        type="text"
                        placeholder="학교명을 입력하세요"
                        autocomplete="off"
                    >
                    <button id="schoolSearchBtn" type="button">
                        검색
                    </button>
                </div>

                <div id="schoolSearchResults" class="school-search-results"></div>
            </section>

            <!-- 선택 학교 -->
            <section id="selectedSchoolSection" class="selected-school-section" hidden>
                <h2 id="selectedSchoolName"></h2>
                <p id="selectedSchoolInfo"></p>
            </section>

            <!-- 시간표 -->
            <section class="timetable-section">
                <div class="section-title">
                    <h2>시간표</h2>
                    <button id="refreshTimetableBtn" type="button">
                        새로고침
                    </button>
                </div>

                <div id="timetableContainer" class="timetable-container">
                    <div class="empty-state">
                        학교를 검색해주세요.
                    </div>
                </div>
            </section>

            <!-- 급식 -->
            <section class="meal-section">
                <div class="section-title">
                    <h2>오늘의 급식</h2>
                    <button id="refreshMealBtn" type="button">
                        새로고침
                    </button>
                </div>

                <div id="mealContainer" class="meal-container">
                    <div class="empty-state">
                        학교를 선택하면 급식 정보를 확인할 수 있습니다.
                    </div>
                </div>
            </section>

            <!-- AI -->
            <section class="ai-section">
                <div class="section-title">
                    <h2>AI 도우미</h2>
                </div>

                <div class="ai-box">
                    <textarea
                        id="aiQuestion"
                        placeholder="궁금한 내용을 입력하세요."
                        rows="4"
                    ></textarea>

                    <button id="aiAskBtn" type="button">
                        AI에게 질문
                    </button>

                    <div id="aiAnswer" class="ai-answer"></div>
                </div>
            </section>

            <!-- 미니게임 -->
            <section class="game-section">
                <div class="section-title">
                    <h2>Bird Bump</h2>
                </div>

                <button id="openGameBtn" type="button" class="game-open-btn">
                    게임 시작
                </button>
            </section>

        </main>


        <!-- ==================== 공지사항 모달 ==================== -->

        <div id="noticeModal" class="modal-overlay" hidden>
            <div class="notice-modal">

                <div class="notice-modal-header">
                    <div>
                        <h2>공지사항</h2>
                        <p id="adminModeLabel">일반 사용자 모드</p>
                    </div>

                    <div class="notice-header-actions">

                        <!-- 일반 사용자도 볼 수 있는 개발자 인증 -->
                        <button
                            id="noticeDeveloperAuthBtn"
                            class="notice-developer-auth-btn"
                            type="button"
                        >
                            개발자 인증
                        </button>

                        <!-- 관리자 인증 후 표시 -->
                        <button
                            id="noticeAddBtn"
                            class="notice-add-btn"
                            type="button"
                            hidden
                        >
                            ＋ 공지 추가
                        </button>

                        <button
                            id="closeNoticeBtn"
                            class="game-close-btn"
                            type="button"
                        >
                            ×
                        </button>

                    </div>
                </div>


                <!-- 공지 목록 -->
                <div id="noticeListView" class="notice-list-view">
                    <div id="noticeList" class="notice-list">
                        <div class="empty-state">
                            공지사항을 불러오는 중...
                        </div>
                    </div>
                </div>


                <!-- 공지 상세 -->
                <div id="noticeDetailView" class="notice-detail-view" hidden>

                    <button
                        id="noticeBackBtn"
                        type="button"
                        class="notice-back-btn"
                    >
                        ← 목록으로
                    </button>

                    <article class="notice-detail">
                        <h3 id="noticeDetailTitle"></h3>

                        <div
                            id="noticeDetailDate"
                            class="notice-detail-date"
                        ></div>

                        <div
                            id="noticeDetailContent"
                            class="notice-detail-content"
                        ></div>
                    </article>

                    <!-- 관리자 전용 -->
                    <div
                        id="noticeDetailAdminActions"
                        class="notice-admin-actions"
                        hidden
                    >
                        <button
                            id="noticeEditBtn"
                            type="button"
                        >
                            수정
                        </button>

                        <button
                            id="noticeDeleteBtn"
                            type="button"
                        >
                            삭제
                        </button>
                    </div>

                </div>


                <!-- 공지 작성/수정 -->
                <div id="noticeEditorView" class="notice-editor-view" hidden>

                    <div class="notice-editor-header">
                        <h3 id="noticeEditorTitle">
                            공지 추가
                        </h3>
                    </div>

                    <label for="noticeTitleInput">
                        제목
                    </label>

                    <input
                        id="noticeTitleInput"
                        type="text"
                        maxlength="100"
                        placeholder="공지사항 제목"
                    >

                    <label for="noticeContentInput">
                        내용
                    </label>

                    <textarea
                        id="noticeContentInput"
                        rows="10"
                        maxlength="5000"
                        placeholder="공지사항 내용을 입력하세요."
                    ></textarea>

                    <div class="notice-editor-actions">

                        <button
                            id="noticeCancelEditBtn"
                            type="button"
                        >
                            취소
                        </button>

                        <button
                            id="noticeSaveBtn"
                            type="button"
                        >
                            저장
                        </button>

                    </div>

                </div>

            </div>
        </div>


        <!-- ==================== 게임 모달 ==================== -->

        <div id="gameModal" class="modal-overlay" hidden>
            <div class="game-modal">

                <div class="game-header">
                    <h2>Bird Bump</h2>

                    <button
                        id="closeGameBtn"
                        class="game-close-btn"
                        type="button"
                    >
                        ×
                    </button>
                </div>

                <div class="game-info">
                    <span>
                        점수:
                        <strong id="gameScore">0</strong>
                    </span>

                    <span>
                        최고점:
                        <strong id="gameBestScore">0</strong>
                    </span>
                </div>

                <canvas
                    id="gameCanvas"
                    width="800"
                    height="500"
                ></canvas>

                <div class="game-controls">
                    <button id="gameStartBtn" type="button">
                        시작
                    </button>

                    <button id="gameRestartBtn" type="button">
                        다시 시작
                    </button>
                </div>

            </div>
        </div>


        <!-- 로딩 -->
        <div id="loadingOverlay" class="loading-overlay" hidden>
            <div class="loading-box">
                <div class="loading-spinner"></div>
                <p id="loadingText">불러오는 중...</p>
            </div>
        </div>


        <!-- 알림 -->
        <div id="toastContainer" class="toast-container"></div>

    </div>

</body>
</html>
